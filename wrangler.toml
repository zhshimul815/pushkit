name = "pushkit"
main = "cloudflare-worker.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

# --- D1 (SQLite) — 100,000 rows written / day on Free ---
[[d1_databases]]
binding = "DB"
database_name = "pushkit-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

# --- R2 (Optional) — 10 GB storage, zero egress on Free ---
# Cloudflare offers 10 GB free R2 storage, but requires enabling R2 in the Cloudflare
# Dashboard (which requires a payment method on file for verification).
# For a 100% free, card-free deploy: leave this commented out. Notification images
# can be pasted as public URLs (or auto-fetched via OpenGraph).
# To enable R2 uploads: enable R2 in Cloudflare dashboard, run
# `npx wrangler r2 bucket create pushkit-media`, and uncomment the block below:
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "pushkit-media"

# --- Queues — 10,000 operations / day on Free ---
# Producer (Next.js app via OpenNext) + consumer (same Worker).
[[queues.producers]]
binding = "PUSH_QUEUE"
queue = "pushkit-send"

[[queues.consumers]]
queue = "pushkit-send"
# max_batch_size = 1 on purpose: one message (40 subscribers) per invocation
# keeps the invocation under the free tier's 50-subrequest limit (docs/PLAN.md O1).
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "pushkit-dlq"

# --- Cron — every 5 min: scheduled campaigns + RSS polling. Daily 03:00 UTC: purge expired endpoints. ---
[triggers]
crons = ["*/5 * * * *", "0 3 * * *"]

[assets]
binding = "ASSETS"
directory = ".open-next/assets"

# --- Variables and Secrets ---
# Manage variables in the Cloudflare Dashboard (Settings > Variables and secrets).
# keep_vars = true above ensures Wrangler never overwrites or deletes dashboard variables on deploy.
# Variables:
#   NEXT_PUBLIC_APP_URL = "https://your-domain.com"
#   OWNER_EMAIL         = "your-email@example.com"
#   EMAIL_FROM          = "PushKit <onboarding@resend.dev>" (or your custom domain)
#   VAPID_SUBJECT       = "mailto:your-email@example.com"
# Secrets:
#   RESEND_API_KEY      = "re_..." (Resend API key)
#   SESSION_SECRET      = (optional entropy string)

# Secrets — set with `wrangler secret put <NAME>`, never commit values:
#   RESEND_API_KEY   — Resend API key for OTP / magic link email
#   SESSION_SECRET   — optional extra entropy for token hashing
